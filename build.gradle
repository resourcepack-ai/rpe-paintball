plugins {
    id 'java'
    id 'com.gradleup.shadow' version '8.3.5'
}

group = 'ai.resourcepack.addons'
version = '0.4.1'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

// Spigot or Paper, 1.21.11 and newer: the marker is fired by holding use (a
// CONSUMABLE that never finishes, which needs the use_effects component 1.21.11
// added so a player can still run while holding it), and a left click aims
// because swing_animation and attack_range (also 1.21.11) take the swing away.
// Bukkit has no API for those components, so the plugin writes them as an item
// string the server parses (Loadout); compiling against the Spigot API is what
// keeps anything Paper-only out. A 1.21.11 server runs on Java 21.
tasks.withType(JavaCompile).configureEach {
    options.release = 21
    options.encoding = 'UTF-8'
    options.compilerArgs += ['-Xlint:deprecation']
}

repositories {
    mavenCentral()
    maven { url = 'https://hub.spigotmc.org/nexus/content/repositories/snapshots/' }
}

// The engine's jar, built beside this project. compileOnly, because the
// engine is a plugin the server already has. ENGINE_JAR points at a
// downloaded RPEngine jar instead.
def engineJar = System.getenv('ENGINE_JAR')
        ? files(System.getenv('ENGINE_JAR'))
        : fileTree(dir: '../../rp-engine/build/libs', include: 'rp-engine-*.jar', exclude: '*-sources.jar')

dependencies {
    compileOnly 'org.spigotmc:spigot-api:1.21.4-R0.1-SNAPSHOT'
    compileOnly engineJar

    // Every message is MiniMessage (config.yml). Paper has Adventure built in
    // and Spigot does not, so the plugin carries its own, relocated below so it
    // never meets Paper's. Gson is the server's on both.
    implementation('net.kyori:adventure-text-minimessage:4.26.1')
    implementation('net.kyori:adventure-text-serializer-gson:4.26.1') {
        exclude group: 'com.google.code.gson'
    }
    implementation('net.kyori:adventure-text-serializer-legacy:4.26.1')
    implementation('net.kyori:adventure-text-serializer-plain:4.26.1')
}

tasks.register('checkEngineJar') {
    doFirst {
        if (engineJar.files.isEmpty()) {
            throw new GradleException(
                    "No RP Engine jar to compile against. Build the engine first (cd ../../rp-engine && ./gradlew build) " +
                    "or set ENGINE_JAR to a downloaded RPEngine jar.")
        }
    }
}
compileJava.dependsOn checkEngineJar

processResources {
    inputs.property('version', project.version)
    filesMatching('plugin.yml') {
        expand(version: project.version)
    }
}

// RPE-paintball-<version>.jar: the deploy reads the version off the name.
shadowJar {
    archiveBaseName.set('RPE-paintball')
    archiveClassifier.set('')
    relocate 'net.kyori', 'ai.resourcepack.addons.paintball.libs.kyori'
    dependencies {
        exclude(dependency('org.jetbrains:annotations'))
        exclude(dependency('org.jspecify:jspecify'))
    }
}

// Only the shadow jar: the plain one is the same classes without Adventure.
jar {
    enabled = false
}

build {
    dependsOn shadowJar
}
