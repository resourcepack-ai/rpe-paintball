# Glyphs the plugin writes into titles and the action bar.

# Full-screen paint, shown as a title when you are hit and tinted the
# shooter's colour. A title is drawn four times larger and its line sits 10
# above the middle, so ascent = height/2 - 3 centres the picture on screen.

screen_splat_1:
  file: screen_splat_1
  height: 96
  ascent: 45

screen_splat_2:
  file: screen_splat_2
  height: 96
  ascent: 45

screen_splat_3:
  file: screen_splat_3
  height: 96
  ascent: 45

pip:
  file: pip
  height: 7
  ascent: 7

grenade_icon:
  file: grenade_icon
  height: 8
  ascent: 7

# The HUD (huds/hud.json, drawn in Studio) prints these through its values.
# Score and clock digits: 11 tall, hanging two pixels above a line of text.

digit_0:
  file: digits
  grid: { rows: 1, columns: 10, cell: 1 }
  height: 11
  ascent: 9

