# Team gear and the things the plugin draws in the world:
# masks are worn, balls fly, splats sit on walls, grenades are thrown.

mask_red:
  material: PAPER
  name: "&cRed Mask"
  model:
    parent: paintball:mask
    textures: {mask: "paintball:item/mask_red", particle: "paintball:item/mask_red"}

ball_red:
  material: PAPER
  name: "&fRed Paintball"
  model:
    parent: paintball:ball
    textures: {ball: "paintball:item/ball_red", particle: "paintball:item/ball_red"}

grenade_red:
  material: PAPER
  name: "&c&lPaint Grenade"
  lore:
    - "&7Right-click to throw. It bursts a moment later,"
    - "&7then recharges before you can throw again."
  model:
    parent: paintball:grenade
    textures: {g: "paintball:item/grenade_red", particle: "paintball:item/grenade_red"}

mine_red:
  material: PAPER
  name: "&c&lPaint Mine"
  lore:
    - "&7Right-click the ground to set it. The first enemy"
    - "&7to step on it sets it off."
  model:
    parent: paintball:grenade
    textures: {g: "paintball:item/grenade_red", particle: "paintball:item/grenade_red"}

