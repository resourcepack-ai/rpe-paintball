# The marker: one model (assets/models/marker.json), a texture per skin, and an
# aimed twin of each whose holder sees the sights. The plugin hands these out.

marker_ember:
  material: PAPER
  name: "&c&lEmber Marker"
  lore:
    - "&7Hold &fright-click&7 to fire, &fleft-click&7 to aim"
    - "&fQ&7 reloads  &8·  &fF&7 scoreboard"
  model:
    parent: paintball:marker
    textures: {atlas: "paintball:item/marker_ember", particle: "paintball:item/marker_ember"}

marker_ember_aim:
  material: PAPER
  name: "&c&lEmber Marker"
  lore:
    - "&7Hold &fright-click&7 to fire, &fleft-click&7 to aim"
    - "&fQ&7 reloads  &8·  &fF&7 scoreboard"
  model:
    parent: paintball:marker
    textures: {atlas: "paintball:item/marker_ember", particle: "paintball:item/marker_ember"}
  first-person:
    parent: paintball:marker_sights
    textures: {atlas: "paintball:item/marker_ember", particle: "paintball:item/marker_ember"}

