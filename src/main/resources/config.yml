# Paintball, an RP Engine addon. Players /pb join; an op runs /pb start (alone is fine).
# A hit splats you and you're back in a few seconds.
#
# Everything from here down to update-check is the server's default: an arena
# can set any of it for itself with /pb arena set <arena> <option> <value>
# (or under settings: beside that arena in arenas.yml), e.g.
#   /pb arena set main mode ctf
#   /pb arena set main match-seconds 300
#   /pb arena set main modes.ffa.kill-limit 20

# What an arena plays unless it sets its own:
#   teams  team deathmatch: red against blue, most splats wins
#   ffa    free for all: everybody for themselves, each in a paint of their own
#   ctf    capture the flag: red against blue, for each other's flag
# /pb start <arena> <mode> plays another mode for one match.
mode: teams

# The most people one arena takes, its lobby and its match together; anybody
# after that is told it is full. Bots are not counted. 0 for no limit.
max-players: 0

match-seconds: 180
# End early when a team reaches this many kills. 0 plays the whole clock.
kill-limit: 0
freeze-seconds: 3
respawn-seconds: 3
# While you're out, the camera circles whoever splatted you. false leaves you a
# free spectator where you fell.
killer-camera: true
# A player just back at a spawn can't be splatted for this long.
spawn-protection-seconds: 1.5
# And, with a radius, for as long as they stay inside this many blocks of the
# spawn they came in at, however long that is: a circle round it, or a square.
# Firing, throwing a grenade or setting a mine ends it, so nobody shoots out of
# a safe zone, and nobody can set a mine in the other side's. The border is
# drawn for whoever is inside. 0 for none.
spawn-protection-radius: 0
spawn-protection-shape: circle
# How long the final scoreboard stays up before everybody is back in the lobby.
end-seconds: 12
# While they wait for a match, players can go down onto the field to practise
# (the target in the lobby's hotbar, or /pb practice): the marker and the
# grenade, everybody down there against everybody, a hit sends you back to a
# spawn, and nothing counts. The match starting puts everybody at their spawn.
practice: true

marker:
  # Ticks between shots while the trigger is held (3 = about seven a second).
  fire-interval-ticks: 3
  hopper: 40
  reload-seconds: 1.6
  # Blocks per tick as the ball leaves the barrel, and what pulls it down.
  speed: 2.4
  gravity: 0.022
  drag: 0.992
  spread-degrees: 0.7
  moving-spread-degrees: 2.4
  # Left click aims down the sights: no spread at all, and slower on your feet.
  # The slowdown is also the zoom (the game narrows the view as you slow down).
  aim-spread-degrees: 0.0
  aim-slowdown: 0.55
  # How far out the crosshair finds what you are aiming at. Every ball is fired
  # so that, drop and all, it lands there.
  range: 96
  lifetime-ticks: 60

grenade:
  # The grenade stays in your hotbar and is greyed out for this long after a
  # throw. 0 for no wait at all.
  cooldown-seconds: 15
  # Whether being splatted brings it back: true and everybody comes back with a
  # grenade ready; false and it keeps recharging while you're out.
  reset-on-respawn: false
  fuse-ticks: 30
  throw-speed: 1.1
  radius: 3.5

mine:
  # How many mines each player can set in a match (right-click the ground with
  # it). 0 for none. The first enemy to step on one sets it off.
  per-match: 1
  # How long after it is set before it can go off, so you can step away.
  arm-seconds: 1.5
  # How far it splats enemies it can see when it goes off.
  radius: 3.0

paint:
  # The most splats one match keeps on the walls; the oldest go first.
  max-decals: 1500

# Which marker each team carries: ember, tide, toxic, sunset, gold, violet,
# bubblegum or frost.
teams:
  red:
    marker: ember
  blue:
    marker: tide

# Free for all: everybody for themselves. First to the kill limit, or the most
# kills when the clock runs out, wins; everybody else is told their place.
ffa:
  # The paint colours handed out, in this order, one to a player (more players
  # than colours share them): red, blue, green, orange, yellow, purple, pink, cyan.
  colours: [red, blue, green, orange, yellow, purple, pink, cyan]
  # The marker each colour carries.
  markers:
    red: ember
    blue: tide
    green: toxic
    orange: sunset
    yellow: gold
    purple: violet
    pink: bubblegum
    cyan: frost

# Whether players choose their colour, with /pb colour or the marker in the
# lobby's hotbar, out of ffa.colours: in a free for all it is their paint, and
# in a team match their marker, while their paint stays their team's. Kept from
# match to match; anybody who has not chosen is given one as before.
colour-pick: true

# Computer players, so a match is not one against two, or one person alone.
# They play like anybody else (a side, a colour, the kill feed, the scoreboard)
# but never count towards stats.json, and they don't throw grenades or set
# mines. People always come first: a bot gives its place up to somebody who
# joins, and a match with only bots left in it ends. Needs Minecraft 1.21.9 or
# newer for the figures (mannequins).
bots:
  # Each side filled up to this many in a team match, and everybody up to this
  # many in a free for all. 0 for none.
  fill: 0
  # In a team match, also a bot for every person the other side has more:
  # three against one becomes three against three.
  even-teams: false
  # How well they shoot: how far a shot may stray, in degrees (a player from the
  # hip is 0.7), and how long they take to fire at somebody who comes into view.
  spread-degrees: 4.0
  reaction-ticks: 12
  # Their names, used in order; more bots than names are Bot 1, Bot 2...
  names: [Splotch, Drip, Smudge, Blot, Streak, Dab, Speckle, Spritz, Gloop, Swatch]

# Capture the flag: take the other team's flag from its base and bring it to
# yours. Spawns are the arena's; the flags stand where /pb arena setflag put
# them (a generated field has them already).
ctf:
  # Captures to win. The team with more when the clock runs out wins.
  captures: 3
  # A dropped flag goes home on its own after this long. A teammate touching it
  # sends it home at once.
  flag-return-seconds: 20
  # Whether your own flag has to be at home for you to score with theirs.
  need-own-flag: true
  # How fast the carrier walks, as a share of their normal speed.
  carrier-speed: 0.85
  # Whether the carrier glows, seen through walls by everybody.
  carrier-glows: true
  # Whether the carrier can throw their grenade and set their mine.
  carrier-can-throw: false
  # How close, in blocks, you have to come to a flag to take it, return it or score.
  flag-reach: 1.3

# Any option above, changed for one mode's matches only. An arena can do the
# same: /pb arena set <arena> modes.ctf.respawn-seconds 6.
modes:
  teams: {}
  ffa:
    match-seconds: 240
    kill-limit: 15
    respawn-seconds: 2
  ctf:
    match-seconds: 480
    respawn-seconds: 5

hud:
  # How long a splat stays in the kill feed (top left).
  kill-feed-seconds: 8
  # How long "SPLATTED <name>" stays up for whoever did it.
  kill-banner-seconds: 2.5
  # How long the hit marker shows round the crosshair, in ticks (20 a second).
  hit-marker-ticks: 6
  # Seconds left on the clock at which a pling sounds and the time left is
  # shown in the middle of the screen: in words, or from 10 down, the number.
  time-warnings: [60, 30, 10, 5, 4, 3, 2, 1]

tab:
  # The player list (Tab) as the match's scoreboard: under the score, a tile
  # for every player in their colour with their name, kills and deaths, a column
  # a team (a free for all best first). false leaves the game's own list, each
  # name with its kills and deaths after it.
  scoreboard: true
  # On Paper, the match's players are taken off the list under the tiles,
  # which already show them. Spigot has no way to, so there they stay.
  hide-players: true

nametags:
  # The names over players' heads. The game's own show through walls; with this
  # on they are text that blocks in front of it hide, like anything else, and
  # the game's own are hidden for the match even when a tab or name tag plugin
  # draws them.
  hide-behind-blocks: false
  # Whether you see the other team's names too, not only your own team's. With
  # hide-behind-blocks off, that means through walls as well.
  enemies: false
  # How a name reads, in MiniMessage, with hide-behind-blocks on. {player} is
  # the name and {team_colour} its paint colour (#FF4655 or #2E9BFF in a team
  # match), which colours what follows it whether or not it is in <>.
  format: "<{team_colour}>{player}"

# Tells you in the console, and ops in chat, when a newer Paintball is on SpigotMC.
update-check: true

# The HUDs and the scoreboards are RP Engine content: this plugin installs them
# into plugins/RPEngine/content/paintball/ (huds/ and dialogs/, all drawn in
# ResourcePack AI Studio). Point these at another HUD or dialog to replace one;
# it has to print the same values. Capture the flag draws the team HUD.
ui:
  hud: paintball:hud
  hud-ffa: paintball:hud_ffa
  scoreboard: paintball:scoreboard
  scoreboard-ffa: paintball:scoreboard_ffa
  scoreboard-ctf: paintball:scoreboard_ctf

# Everything a player reads. MiniMessage; {prefix} is the prefix below, and the
# other {names} are filled in by the plugin.
messages:
  prefix: "<bold><gradient:#FF4655:#FFD23F:#2E9BFF>PAINTBALL</gradient></bold> <#5F6368>▏</#5F6368> <#E8EAED>"

  joined-lobby: "{prefix}<#5BE37D>+</#5BE37D> <white>{player}</white> joined the lobby <#9AA0A6>({count})"
  joined-team: "{prefix}<white>{player}</white> joined <{colour}>{team}</{colour}>."
  joined-ffa: "{prefix}<{colour}>{player}</{colour}> joined the match."
  ctf-no-flags: "{prefix}<#FF5C5C>{arena} has nowhere for the flags. An op stands at each base and runs <white>/pb arena setflag {id} red</white> and <white>blue</white>."
  left: "{prefix}<#FF5C5C>-</#FF5C5C> <white>{player}</white> left."
  start-hint-op: "{prefix}Start whenever you like with <white>/pb start</white>."
  start-hint: "{prefix}Waiting for an op to start the match."
  already-in: "{prefix}<#FF5C5C>You're already in. <white>/pb leave</white> to go."
  no-arena: "{prefix}<#FF5C5C>There's no arena yet. An op can build one with <white>/pb arena generate <id></white>."
  arena-not-ready: "{prefix}<#FF5C5C>{arena} isn't set up: it needs {missing}."
  # A disabled arena (/pb arena disable): nobody can join it or start a match on it.
  arena-closed: "{prefix}<#FF5C5C>{arena} is closed."
  # An arena with max-players people in it already.
  arena-full: "{prefix}<#FF5C5C>{arena} is full <#9AA0A6>({max} players)."
  not-during-match: "{prefix}<#FF5C5C>Not during a match. <white>/pb leave</white> to go."
  restored: "{prefix}Your last match was cut short, so you've got your things back."
  match-stopped: "{prefix}The match was stopped."
  closed: "{prefix}Paintball is closed for now."

  # Picking a side in the lobby. Picks are kept even: past one player apart,
  # whoever picked the crowded side last plays for the other.
  picked: "{prefix}You'll play for <{colour}>{team}</{colour}>."
  picked-next: "{prefix}You'll play for <{colour}>{team}</{colour}> from the next match."
  picked-random: "{prefix}You'll play wherever you're needed."
  colour-picked: "{prefix}Your colour is <{colour}>{name}</{colour}>: your paint in a free for all, your marker in a team match."
  colour-picked-next: "{prefix}Your colour is <{colour}>{name}</{colour}> from the next match."
  colour-random: "{prefix}You'll be given a colour."
  colour-off: "{prefix}Colours aren't chosen here."
  pick-moved: "{prefix}Too many picked <{from_colour}>{from}</{from_colour}>, so you're on <{colour}>{team}</{colour}> this match."
  pick-none: "RANDOM"

  # Practising on the field while the lobby waits (practice: true above).
  practice-hint: "{prefix}While you wait, the <#5BE37D>target</#5BE37D> in your hotbar takes you down onto the field to practise."
  practice-on: "{prefix}You're on the field. Nothing counts down here; the <#FFD23F>feather</#FFD23F> or <white>/pb practice</white> takes you back up."
  practice-back: "{prefix}Back in the lobby."
  practice-off: "{prefix}<#FF5C5C>There's no practising here."
  practice-not-now: "{prefix}<#FF5C5C>Only while you wait for a match."

  # Shown at the bottom of the screen while you're in the lobby.
  lobby-ffa: "<#9AA0A6>Lobby  <#5F6368>·</#5F6368>  <#FFD23F>{mode}</#FFD23F>  <#5F6368>·</#5F6368>  {count} in  <#5F6368>·</#5F6368>  /pb leave to go"
  lobby-teams: "<#9AA0A6>Lobby  <#5F6368>·</#5F6368>  <#FFD23F>{mode}</#FFD23F>  <#5F6368>·</#5F6368>  <#FF4655>RED {red}</#FF4655>  <#2E9BFF>BLUE {blue}</#2E9BFF>  <#5F6368>·</#5F6368>  you: <{pick_colour}>{pick}</{pick_colour}>  <#5F6368>·</#5F6368>  /pb leave to go"

  # The HUD's words. Plain text: the HUD draws them in its own colours.
  hud-get-ready: "GET READY"
  hud-protected: "PROTECTED"
  mine-in-spawn: "<#FF5C5C>Not in their spawn"
  hud-first-to: "FIRST TO {kills}"
  hud-reloading: "RELOADING"
  hud-marker: "{skin} MARKER"
  hud-practice: "PRACTICE  ·  NOTHING COUNTS"
  # The words in the middle of the screen, in the HUD's own big lettering. It
  # has A-Z, 0-9, ! - ' and spaces; anything else is left out. The result is
  # drawn over a band of fixed width, so a much longer word runs past its ends.
  hud-your-team: "YOU'RE TEAM"
  hud-team-red: "RED"
  hud-team-blue: "BLUE"
  hud-go: "GO!"
  hud-splatted-by: "SPLATTED BY"
  hud-splatted: "SPLATTED"
  hud-victory: "VICTORY"
  hud-defeat: "DEFEAT"
  hud-draw: "DRAW"
  # The clock's warnings (hud.time-warnings above), in the same lettering.
  hud-minute-left: "1 MINUTE LEFT"
  hud-minutes-left: "{minutes} MINUTES LEFT"
  hud-seconds-left: "{seconds} SECONDS LEFT"
  # Free for all.
  hud-ffa-banner: "FREE FOR ALL"
  hud-ffa-you: "YOU"
  hud-ffa-leading: "YOU LEAD"
  hud-ffa-place: "{place} OF {players}"
  hud-ffa-place-limit: "{place} OF {players}  ·  FIRST TO {kills}"
  hud-ffa-kills: "{kills} KILLS"
  hud-place-1: "1ST"
  hud-place-2: "2ND"
  hud-place-3: "3RD"
  hud-place-n: "{place}TH"
  # Capture the flag. The flag lines are in the big lettering; {team} is the flag's.
  hud-ctf-first-to: "FIRST TO {captures} CAPTURES"
  hud-ctf-carrying: "YOU HAVE THE FLAG  ·  TAKE IT HOME"
  hud-flag-taken: "{team} FLAG TAKEN"
  hud-flag-dropped: "{team} FLAG DROPPED"
  hud-flag-returned: "{team} FLAG RETURNED"
  hud-flag-captured: "{team} FLAG CAPTURED"

  # The modes' names, in the lobby, the player list and placeholders.
  mode-teams: "TEAM DEATHMATCH"
  mode-ffa: "FREE FOR ALL"
  mode-ctf: "CAPTURE THE FLAG"

  # The teams', the paint colours' and the markers' names, wherever one is
  # written out: chat, the lobby, the marker's name on the HUD, the flags' news
  # and the placeholders. The HUD's big lettering has its own (hud-team-red).
  team-red: "Red"
  team-blue: "Blue"
  colour-any: "Any"
  colour-red: "Red"
  colour-blue: "Blue"
  colour-green: "Green"
  colour-orange: "Orange"
  colour-yellow: "Yellow"
  colour-purple: "Purple"
  colour-pink: "Pink"
  colour-cyan: "Cyan"
  marker-ember: "Ember"
  marker-tide: "Tide"
  marker-toxic: "Toxic"
  marker-sunset: "Sunset"
  marker-gold: "Gold"
  marker-violet: "Violet"
  marker-bubblegum: "Bubblegum"
  marker-frost: "Frost"

  # Capture the flag, in chat. {player} in {colour}; {flag} is the flag's team in {flag_colour}.
  ctf-taken: "{prefix}<{colour}>{player}</{colour}> took the <{flag_colour}>{flag}</{flag_colour}> flag!"
  ctf-dropped: "{prefix}<{colour}>{player}</{colour}> dropped the <{flag_colour}>{flag}</{flag_colour}> flag."
  ctf-returned: "{prefix}<{colour}>{player}</{colour}> sent the <{flag_colour}>{flag}</{flag_colour}> flag home."
  ctf-returned-auto: "{prefix}The <{flag_colour}>{flag}</{flag_colour}> flag went home."
  ctf-captured: "{prefix}<{colour}>{player}</{colour}> captured the <{flag_colour}>{flag}</{flag_colour}> flag!"

  # The scoreboard dialog's heading.
  scoreboard-victory: "VICTORY"
  scoreboard-defeat: "DEFEAT"
  scoreboard-draw: "DRAW"
  scoreboard-live: "SCOREBOARD"
  scoreboard-last: "LAST MATCH"
  # Its column headings.
  scoreboard-red: "RED"
  scoreboard-blue: "BLUE"
  scoreboard-kills: "K"
  scoreboard-deaths: "D"
  scoreboard-accuracy: "ACC"
  scoreboard-captures: "CAP"
  scoreboard-players: "PLAYERS"
  scoreboard-place: "#"
  # Its button.
  scoreboard-close: "Close"

  # The player list (Tab). {logo} is the name in the HUD's lettering, as tall
  # as three lines, so it wants a blank line above it and two below.
  tab-header-ffa: "\n\n<white>{logo}</white>\n\n\n<#5F6368>{mode} · {map}</#5F6368>\n\n<#FFD23F><bold>{leader}  {leader_kills}</bold></#FFD23F>     <white>{time}</white>\n"
  tab-header: "\n\n<white>{logo}</white>\n\n\n<#5F6368>{mode} · {map}</#5F6368>\n\n<#FF4655><bold>RED  {red}</bold></#FF4655>     <white>{time}</white>     <#2E9BFF><bold>{blue}  BLUE</bold></#2E9BFF>\n"
  tab-footer: "\n<#9AA0A6>Press <white><key:key.swapOffhand></white> for the full scoreboard</#9AA0A6>\n"
  # {logo}'s words: the first in red, the second in blue. A-Z, 0-9, ! - ' and spaces.
  tab-logo-1: "PAINT"
  tab-logo-2: "BALL"
  # The tiles under the header (tab.scoreboard). A name ({player}) as it is
  # written on a tile, on your own, and on the tile of somebody who is out; the
  # kills and deaths at a tile's right ({kills}, {deaths}, and in capture the
  # flag {captures}); a free for all's place at its left; and, past sixteen
  # tiles, how many more there are.
  tab-name: "<white><bold>{player}"
  tab-name-you: "<#FFD23F><bold>{player}"
  tab-name-out: "<#7A8088><bold>{player}"
  tab-score: "<#5BE37D>{kills}</#5BE37D><#9AA0A6>K</#9AA0A6> <#FF8A3D>{deaths}</#FF8A3D><#9AA0A6>D</#9AA0A6>"
  tab-score-ctf: "<#FFD23F>{captures}</#FFD23F><#9AA0A6>C</#9AA0A6> <#5BE37D>{kills}</#5BE37D><#9AA0A6>K</#9AA0A6> <#FF8A3D>{deaths}</#FF8A3D><#9AA0A6>D</#9AA0A6>"
  tab-place: "<#9AA0A6>{place}"
  tab-more: "<#9AA0A6>+{count} more"

  # PlaceholderAPI's %paintball_arena_status_<arena>%.
  status-maintenance: "Maintenance"
  status-not-configured: "Not Configured"
  status-ready: "Ready"
  status-starting: "Starting"
  status-in-game: "In Game"
  status-ending: "Ending"

  # The lobby's hotbar.
  item-scoreboard: "<bold><#FFD23F>Scoreboard"
  item-scoreboard-lore: "<#9AA0A6>The last match, player by player"
  item-team-red: "<bold><#FF4655>Play for Red"
  item-team-red-lore: "<#9AA0A6>From the next match. Sides are kept even"
  item-team-blue: "<bold><#2E9BFF>Play for Blue"
  item-team-blue-lore: "<#9AA0A6>From the next match. Sides are kept even"
  item-colour: "<bold><{colour}>Colour: {name}"
  item-colour-lore: "<#9AA0A6>Your paint in a free for all, your marker in a team match"
  item-practice: "<bold><#5BE37D>Practise"
  item-practice-lore: "<#9AA0A6>Down onto the field until the match starts. Nothing counts"
  item-practice-leave: "<bold><#FFD23F>Back to the lobby"
  item-practice-leave-lore: "<#9AA0A6>Up into the waiting box"
  item-leave: "<bold><#FFD23F>Leave"
  item-leave-lore: "<#9AA0A6>Back to where you were"
  item-use: "<#5F6368>Right-click"

  # Told to ops when a newer version is on SpigotMC. {latest} is the new
  # version, {running} this one's. The link opens the SpigotMC page.
  update: "{prefix}Paintball <white>{latest}</white> is out <#9AA0A6>(you have {running}).</#9AA0A6> "
  update-link: "<#FFD23F><underlined>Get it on SpigotMC"
