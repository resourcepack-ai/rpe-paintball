name: RPEPaintball
main: ai.resourcepack.addons.paintball.PaintballPlugin
version: ${version}
api-version: '1.21.11'
description: 5v5 paintball for RP Engine - one hit and you're out for three seconds, most kills wins.
author: ResourcePack AI
# Hard, not soft: the marker, the paint, the HUD and the scoreboard are all
# RP Engine content. This plugin is the game on top.
depend: [RPEngine]
softdepend: [Multiverse-Core]

commands:
  paintball:
    description: Paintball - join, leave, the scoreboard; staff start and stop matches and build arenas.
    usage: /<command> [join|team|leave|scoreboard|start|stop|arena|reload|as]
    aliases: [pb]
    # No command-level permission: every subcommand checks its own node below,
    # and /pb leave needs none, so nobody can be stuck in a match.

# One node per subcommand. paintball.play and paintball.admin are convenience
# parents: they grant everything under them, and nothing checks them directly.
permissions:
  paintball.play:
    description: Everything a player does - join, pick a team, the scoreboard. A parent; nothing checks it.
    default: true
    children:
      paintball.join: true
      paintball.team: true
      paintball.scoreboard: true
  paintball.join:
    description: /pb join - into an arena's lobby.
    default: true
  paintball.team:
    description: /pb team, and the red and blue items in the lobby's hotbar.
    default: true
  paintball.scoreboard:
    description: /pb scoreboard, F while in a match or its lobby, and the lobby's scoreboard item.
    default: true
  paintball.admin:
    description: Every staff node - start, stop, reload, /pb as, arenas, the command bypass. A parent; nothing checks it.
    default: op
    children:
      paintball.start: true
      paintball.stop: true
      paintball.reload: true
      paintball.as: true
      paintball.arena: true
      paintball.arena.generate: true
      paintball.arena.delete: true
      paintball.bypass.commands: true
  paintball.start:
    description: /pb start - start a match now (it joins you first if you are not in).
    default: op
  paintball.stop:
    description: /pb stop - end a match, or empty a lobby.
    default: op
  paintball.reload:
    description: /pb reload - re-read config.yml and arenas.yml.
    default: op
  paintball.as:
    description: /pb as <player> ... - run a subcommand as somebody else (for NPCs and console). Checked against THEIR permissions.
    default: op
  paintball.arena:
    description: /pb arena setup - list, create, setwaiting, addspawn, clearspawns, wand and setbounds, enable, disable, tp, name, set (an arena's own settings).
    default: op
  paintball.arena.generate:
    description: /pb arena generate - build a whole field, replacing every block in a 31x14x57 box (two below your feet to eleven above) and building a glass waiting box over it, up to 17 above.
    default: op
  paintball.arena.delete:
    description: /pb arena delete - remove an arena, ending its match.
    default: op
  paintball.bypass.commands:
    description: Run any command during a match, not only the few a player may (/pb, /msg, /r, /me, /list...).
    default: op
  paintball.update:
    description: Be told when a newer Paintball is on SpigotMC.
    default: op
